name: vicedex
description: "ViceDex – an unofficial, fan-made GTA VI companion (frontend only)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.6.0
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Built by backend/ingest/build_pack.py. Offline fallback and first-frame
    # content; refreshed over HTTP when VICEDEX_PACK_URL is set.
    - assets/content_pack.json
